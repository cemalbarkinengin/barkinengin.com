# Temporary: looks up label information for releases and saves it to this branch.
name: Temporary site checks
on:
  push:
    branches: [claude/site-checks]
permissions:
  contents: write
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look up labels
        run: python3 .github/claude/labels.py
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f check-results
          git commit -m "Check results [skip ci]"
          git push
